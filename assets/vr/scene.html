 for(let r=0;r<2;r++)for(let i=0;i<30;i++)gl[(i*7+r*3+(i>>2))%gl.length](10+i*17,18+r*28);g.fillStyle='rgba(70,45,20,.5)';g.fillRect(0,0,w,3);g.fillRect(0,h-3,w,3)})}
