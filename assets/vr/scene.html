<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff;text-align:center;
 background:linear-gradient(transparent 35%,rgba(0,0,0,.55));}
#t1{font-size:38px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 14px #000;opacity:0;transform:translateY(24px);transition:all 1.4s}
#t2{font-size:17px;margin-top:8px;text-shadow:0 2px 8px #000;opacity:0;transition:all 1.8s .5s}
#intro.on #t1,#intro.on #t2{opacity:1;transform:none}
#skip{position:fixed;top:12px;right:12px;background:rgba(0,0,0,.45);color:#fff;border:1px solid #fff5;border-radius:18px;padding:8px 14px;font-size:14px}
#hud{position:fixed;left:0;right:0;bottom:0;pointer-events:none;display:none}
#note{position:fixed;left:8px;right:8px;top:8px;text-align:center;color:#fff9;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
#stick{position:fixed;left:22px;bottom:34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.65)}
#photo{position:fixed;right:22px;bottom:44px;width:70px;height:70px;border-radius:50%;background:#d9a441;border:4px solid #fff;font-size:30px;line-height:62px;text-align:center;box-shadow:0 4px 14px #0008}
#hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#fffb;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
.lb{position:fixed;left:0;top:0;color:#fff;font-size:13px;font-weight:800;background:rgba(0,0,0,.45);padding:4px 9px;border-radius:12px;white-space:nowrap;pointer-events:none;will-change:transform}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
</style></head><body>
<div id="intro"><div id="t1"></div><div id="t2"></div></div>
<div id="note"></div><div id="flash"></div>
<div id="skip"></div>
<div id="stick" style="display:none"><div id="knob"></div></div>
<div id="photo" style="display:none">📷</div>
<div id="hint"></div>
<script src="three.min.js"></script>
<script>
const Q=new URLSearchParams(location.search);
const AR=Q.get('lang')==='ar', SC=Q.get('s')||'giza';
const TXT={
 giza:{t:AR?'أهرامات الجيزة':'Pyramids of Giza',s:AR?'مشهد ثلاثي الأبعاد مرسوم، اتحرك واتفرج':'A stylized 3D scene. Walk around.'},
 karnak:{t:AR?'معبد الكرنك':'Karnak Temple',s:AR?'قاعة الأعمدة الكبرى (مشهد مرسوم)':'The Great Hypostyle Hall (stylized)'}
}[SC];
const L={skip:AR?'تخطّي':'Skip',note:AR?'مشهد ثلاثي الأبعاد مرسوم بالكود، مش تصوير حقيقي. الصور الحقيقية في المعرض.':'A stylized 3D scene drawn in code, not real photography. Real photos are in the gallery.',
 hint:AR?'العصا يسار للمشي • اسحب باقي الشاشة للنظر':'Left stick to walk • drag anywhere else to look'};
document.getElementById('t1').textContent=TXT.t;document.getElementById('t2').textContent=TXT.s;
document.getElementById('skip').textContent=L.skip;document.getElementById('note').textContent=L.note;document.getElementById('hint').textContent=L.hint;

const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,3000);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=4;return t}
function rnd(a){return (Math.sin(a*127.1)*43758.5453)%1}
const stoneTex=(base,rep)=>canvasTex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=0;y<8;y++){const off=(y%2)*16;for(let x=-1;x<8;x++){const v=Math.abs(rnd(x*7+y*13))*30-15;g.fillStyle=`rgba(${v>0?255:60},${v>0?240:40},${v>0?200:20},${Math.abs(v)/90})`;g.fillRect(x*32+off,y*32,32,32);g.strokeStyle='rgba(70,45,20,.35)';g.lineWidth=2;g.strokeRect(x*32+off,y*32,32,32)}}},rep);
const sandTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d9b673';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,235,190':'170,120,60'},${Math.random()*.18})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[90,90]);

// sky dome
(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float h=normalize(p).y;vec3 top=vec3(.16,.45,.82),mid=vec3(.55,.78,.95),hor=vec3(1.,.93,.78);vec3 c=mix(hor,mid,smoothstep(0.,.25,h));c=mix(c,top,smoothstep(.2,.8,h));gl_FragColor=vec4(c,1.);}'});
 S.add(new THREE.Mesh(new THREE.SphereGeometry(2500,24,16),m))})();
S.fog=new THREE.Fog(0xf3dfb4,260,1500);
S.add(new THREE.HemisphereLight(0xfff4de,0xb8935a,0.55));
const sun=new THREE.DirectionalLight(0xfff0cf,0.75);sun.position.set(-300,380,200);S.add(sun);
const sunSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,2,64,64,64);gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(.25,'rgba(255,230,160,.6)');gr.addColorStop(1,'rgba(255,230,160,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}),fog:false,depthWrite:false,transparent:true}));
sunSpr.scale.set(520,520,1);sunSpr.position.set(-900,1100,600);S.add(sunSpr);
// clouds
const cloudMat=new THREE.SpriteMaterial({map:canvasTex(128,64,(g,w,h)=>{g.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<9;i++){g.beginPath();g.arc(20+i*11,34+Math.sin(i*2)*8,14+((i*7)%9),0,7);g.fill()}}),fog:false,transparent:true,opacity:.85,depthWrite:false});
const clouds=[];for(let i=0;i<14;i++){const c=new THREE.Sprite(cloudMat);c.scale.set(300+i*20,150,1);c.position.set(Math.cos(i*1.7)*1300,380+(i%4)*60,Math.sin(i*1.7)*1300);S.add(c);clouds.push(c)}

let groundH=(x,z)=>0, LIMIT=420;
const labels=[];
function addLabel(text,x,y,z){const d=document.createElement('div');d.className='lb';d.textContent=text;document.body.appendChild(d);labels.push({d,p:new THREE.Vector3(x,y,z)})}

if(SC==='giza'){
 const D=(x,z)=>{const r=Math.hypot(x-60,z+80);const f=Math.min(1,Math.max(0,(r-190)/120));return f*(Math.sin(x*.012)*Math.cos(z*.01)*14+Math.sin(x*.03+z*.02)*4+10*f)};
 groundH=D;
 const g=new THREE.PlaneGeometry(2400,2400,150,150);g.rotateX(-Math.PI/2);const pa=g.attributes.position;for(let i=0;i<pa.count;i++){pa.setY(i,D(pa.getX(i),pa.getZ(i)))}g.computeVertexNormals();
 S.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:sandTex})));
 const pyr=(x,z,side,h,rot)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(side/Math.SQRT2,h,4,1),new THREE.MeshLambertMaterial({map:stoneTex('#cfa968',[side/24,h/24])}));m.rotation.y=Math.PI/4+(rot||0);m.position.set(x,D(x,z)+h/2-1,z);S.add(m);return m};
 pyr(60,-80,115,73);  // Khufu (half scale)
 const k=pyr(-100,-210,108,72);// Khafre
 const cap=new THREE.Mesh(new THREE.ConeGeometry(14,15,4,1),new THREE.MeshLambertMaterial({color:0xf5ecd6}));cap.rotation.y=Math.PI/4;cap.position.set(-100,D(-100,-210)+72-6,-210);S.add(cap);
 pyr(-240,-330,52,33); // Menkaure
 [[-190,-336],[-140,-350],[-120,-390]].forEach(p=>pyr(p[0],p[1],20,12));
 [[150,-30],[160,-70],[170,-110]].forEach(p=>pyr(p[0],p[1],20,12));
 // Sphinx
 const sp=new THREE.Group();const sm=new THREE.MeshLambertMaterial({map:stoneTex('#d4a965',[2,2])});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(5,24,6,12),sm);body.rotation.z=Math.PI/2;body.position.set(0,6,0);sp.add(body);
 const hip=new THREE.Mesh(new THREE.SphereGeometry(6.5,14,10),sm);hip.position.set(-14,7,0);sp.add(hip);
 [-3.6,3.6].forEach(z=>{const paw=new THREE.Mesh(new THREE.BoxGeometry(18,3.2,3),sm);paw.position.set(22,1.8,z);sp.add(paw)});
 const chest=new THREE.Mesh(new THREE.SphereGeometry(5.5,14,10),sm);chest.position.set(11,9,0);sp.add(chest);
 const head=new THREE.Mesh(new THREE.SphereGeometry(4.2,16,12),new THREE.MeshLambertMaterial({color:0xd9b078}));head.position.set(15,17,0);sp.add(head);
 const nem=new THREE.Mesh(new THREE.BoxGeometry(6.6,9,10),new THREE.MeshLambertMaterial({color:0x2d6fb3}));nem.position.set(13.6,15.5,0);sp.add(nem);
 [-1,1].forEach(s=>{const l=new THREE.Mesh(new THREE.BoxGeometry(2,8,2.2),new THREE.MeshLambertMaterial({color:0xd4a23a}));l.position.set(16.5,12.5,s*4.6);sp.add(l)});
 const nose=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.4,1.1),new THREE.MeshLambertMaterial({color:0xc99c64}));nose.position.set(19.1,16.6,0);sp.add(nose);
 sp.position.set(150,D(150,40),40);sp.rotation.y=-Math.PI/2+0.2;S.add(sp);sp.scale.setScalar(1.5);
 // palms
 const palm=(x,z)=>{const gr=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,10,6),new THREE.MeshLambertMaterial({color:0x7a5230}));t.position.y=5;gr.add(t);
  for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.9,8,4),new THREE.MeshLambertMaterial({color:0x2f8a3f}));l.rotation.z=1.2;l.rotation.y=i*0.9;l.position.set(Math.cos(i*.9)*3.2,10.2,-Math.sin(i*.9)*3.2);l.lookAt(0,11,0);l.rotateX(Math.PI/2);gr.add(l)}
  gr.position.set(x,D(x,z),z);S.add(gr)};
 for(let i=0;i<22;i++){palm(-300+Math.cos(i*2.3)*40+i*14,330+Math.sin(i*1.7)*24)}
 // camel caravan silhouette
 const camel=(x,z)=>{const c=new THREE.Group();const m=new THREE.MeshLambertMaterial({color:0xa5703b});const b=new THREE.Mesh(new THREE.BoxGeometry(5,2.4,1.8),m);b.position.y=3.4;c.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(1.1,8,6),m);h.position.set(1.4,4.4,0);c.add(h);
  const n=new THREE.Mesh(new THREE.CylinderGeometry(.4,.55,2.6,6),m);n.position.set(2.6,4.6,0);n.rotation.z=-.6;c.add(n);
  const hd=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,.8),m);hd.position.set(3.7,5.7,0);c.add(hd);
  [[-1.8,.7],[-1.8,-.7],[1.8,.7],[1.8,-.7]].forEach(p=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,3,5),m);l.position.set(p[0],1.5,p[1]);c.add(l)});
  c.position.set(x,D(x,z),z);S.add(c);return c};
 const camels=[0,1,2,3].map(i=>camel(-30+i*9,120-i*5));
 addLabel(AR?'الهرم الأكبر • خوفو':'Great Pyramid • Khufu',60,95,-80);
 addLabel(AR?'هرم خفرع':'Pyramid of Khafre',-100,92,-210);
 addLabel(AR?'هرم منكاورع':'Pyramid of Menkaure',-240,45,-330);
 addLabel(AR?'أبو الهول':'The Great Sphinx',150,32,40);
 var camelsTick=(t)=>camels.forEach((c,i)=>{c.position.x=-30+i*9+Math.sin(t*.1)*30;c.position.y=groundH(c.position.x,c.position.z)+Math.abs(Math.sin(t*2+i))*.15});
 var START=[0,0,200],YAW=0.1;
 var introPath=(u)=>{const a=-1.6+u*2.0,r=520-u*320;return [Math.sin(a)*r+60,160-u*140,Math.cos(a)*r-80,60,30,-80]};
} else {
 // KARNAK hypostyle hall
 const D=()=>0;groundH=D;LIMIT=150;
 S.fog=new THREE.Fog(0xe8cf9c,120,900);
 const g=new THREE.PlaneGeometry(2000,2000);g.rotateX(-Math.PI/2);S.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:sandTex})));
 const stone=new THREE.MeshLambertMaterial({map:stoneTex('#d8b57a',[2,4])});
 const col=(x,z,big)=>{const gp=new THREE.Group();const r=big?3.4:2.4,h=big?34:24;const sh=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,h,16),stone);sh.position.y=h/2;gp.add(sh);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(r*1.9,r,big?7:4,16),stone);cap.position.y=h+(big?3:2);gp.add(cap);
  const bs=new THREE.Mesh(new THREE.CylinderGeometry(r*1.15,r*1.25,1.2,16),stone);bs.position.y=.6;gp.add(bs);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(r*1.02,r*1.02,2,16),new THREE.MeshLambertMaterial({color:0x2f8aa0}));band.position.y=h*.7;gp.add(band);
  gp.position.set(x,0,z);S.add(gp)};
 for(let i=-6;i<=6;i++){for(let j=0;j<10;j++){const mid=Math.abs(i)<=1;col(i*13,-j*14,mid)}}
 // architraves / roof only over the back half for a view of the sky in front
 for(let i=-6;i<6;i++){for(let j=4;j<10;j++){const s=new THREE.Mesh(new THREE.BoxGeometry(13,4,14),stone);s.position.set(i*13+6.5,(Math.abs(i)<=1?41:28),-j*14);S.add(s)}}
 // pylon at the entrance
 [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(46,52,16),stone);p.position.set(s*34,26,34);S.add(p)});
 const lint=new THREE.Mesh(new THREE.BoxGeometry(24,10,16),stone);lint.position.set(0,47,34);S.add(lint);
 // obelisks
 [-26,26].forEach(x=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(1.2,2.8,48,4),new THREE.MeshLambertMaterial({color:0xd09a66}));o.rotation.y=Math.PI/4;o.position.set(x,24,60);S.add(o);const tip=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,4),new THREE.MeshLambertMaterial({color:0xe3b84a}));tip.rotation.y=Math.PI/4;tip.position.set(x,50,60);S.add(tip)});
 addLabel(AR?'قاعة الأعمدة الكبرى':'Great Hypostyle Hall',0,48,-40);
 addLabel(AR?'المسلات':'Obelisks',0,56,60);
 addLabel(AR?'الصرح':'The Pylon',-34,58,34);
 var camelsTick=()=>{};
 var START=[0,0,95],YAW=0;
 var introPath=(u)=>{const a=-1.2+u*1.4,r=180-u*70;return [Math.sin(a)*r,70-u*55,Math.cos(a)*r+20,0,20,-30]};
}

// ---- player ----
const P={x:START[0],z:START[2],yaw:YAW,pitch:-0.02};let mode='intro',t0=performance.now();
const intro=document.getElementById('intro');setTimeout(()=>intro.classList.add('on'),200);
function endIntro(){if(mode!=='intro')return;mode='walk';intro.style.transition='opacity 1s';intro.style.opacity=0;document.getElementById('skip').style.display='none';document.getElementById('stick').style.display='block';document.getElementById('photo').style.display='block'}
document.getElementById('skip').addEventListener('click',endIntro);
if(Q.get('walk')){P.x=+Q.get('x')||P.x;P.z=+Q.get('z')||P.z;P.yaw=+Q.get('yaw')||0;P.pitch=+Q.get('pitch')||0;endIntro();intro.style.opacity=0;document.getElementById('skip').style.display='none'}

const mv={x:0,y:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null,lookId=null,lx=0,ly=0;
stick.addEventListener('touchstart',e=>{e.preventDefault();stickId=e.changedTouches[0].identifier},{passive:false});
function stickMove(t){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(t.clientX-cx)/55,dy=(t.clientY-cy)/55;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}mv.x=dx;mv.y=dy;knob.style.left=(35+dx*35)+'px';knob.style.top=(35+dy*35)+'px'}
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===stickId)stickMove(t);else if(t.identifier===lookId){P.yaw-=(t.clientX-lx)*0.005;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(t.clientY-ly)*0.004));lx=t.clientX;ly=t.clientY}}e.preventDefault()},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===stickId){stickId=null;mv.x=mv.y=0;knob.style.left='35px';knob.style.top='35px'}if(t.identifier===lookId)lookId=null}});
addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.identifier===stickId)continue;if(e.target.id==='photo'||e.target.id==='skip'||e.target.closest('#stick'))continue;lookId=t.identifier;lx=t.clientX;ly=t.clientY}},{passive:false});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let md=false;addEventListener('mousedown',e=>{md=true;lx=e.clientX;ly=e.clientY});addEventListener('mouseup',()=>md=false);addEventListener('mousemove',e=>{if(md&&mode==='walk'){P.yaw-=(e.clientX-lx)*0.005;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY}});

function photo(){const f=document.getElementById('flash');f.style.transition='none';f.style.opacity=.9;setTimeout(()=>{f.style.transition='opacity .4s';f.style.opacity=0},40);
 R.render(S,cam);const url=R.domElement.toDataURL('image/jpeg',0.92);
 if(window.NiloPhoto&&NiloPhoto.postMessage)NiloPhoto.postMessage(url);else{const a=document.createElement('a');a.href=url;a.download='nilo.jpg';a.click()}}
document.getElementById('photo').addEventListener('click',photo);
window.nilo_snap=photo;

let last=performance.now();const tmp=new THREE.Vector3();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
 clouds.forEach((c,i)=>{c.position.x+=dt*(2+i%3)*(i%2?1:-1);if(Math.abs(c.position.x)>1500)c.position.x*=-.98});
 camelsTick(t);
 if(mode==='intro'){const u=Math.min(1,t/9);const e=u*u*(3-2*u);const p=introPath(e);cam.position.set(p[0],p[1]+groundH(p[0],p[2]),p[2]);cam.lookAt(p[3],p[4],p[5]);if(t>9.5)endIntro();}
 else{
  let fx=-mv.y,sx=mv.x;if(keys.w||keys.arrowup)fx=1;if(keys.s||keys.arrowdown)fx=-1;if(keys.a||keys.arrowleft)sx=-1;if(keys.d||keys.arrowright)sx=1;
  const sp=(keys.shift?60:28);const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
  P.x+=(-sin*fx+cos*sx)*sp*dt;P.z+=(-cos*fx-sin*sx)*sp*dt;
  const r=Math.hypot(P.x,P.z);if(r>LIMIT+(SC==='giza'?100:0)){const k=(LIMIT+(SC==='giza'?100:0))/r;P.x*=k;P.z*=k}
  const bob=(Math.abs(fx)+Math.abs(sx))>0.1?Math.sin(t*9)*0.12:0;
  cam.position.set(P.x,groundH(P.x,P.z)+1.75+bob,P.z);cam.rotation.order='YXZ';cam.rotation.set(P.pitch,P.yaw,0);
 }
 R.render(S,cam);
 labels.forEach(l=>{tmp.copy(l.p).project(cam);const d=cam.position.distanceTo(l.p);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&mode==='walk'&&d<700;l.d.style.opacity=vis?1:0;l.d.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`});
}
requestAnimationFrame(loop);
</script></body></html>
