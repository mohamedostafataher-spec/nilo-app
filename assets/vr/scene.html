<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff;text-align:center;
 background:linear-gradient(transparent 35%,rgba(0,0,0,.55));}
#t1{font-size:38px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 14px #000;opacity:0;transform:translateY(24px);transition:all 1.4s}
#t2{font-size:17px;margin-top:8px;text-shadow:0 2px 8px #000;opacity:0;transition:all 1.8s .5s}
#intro.on #t1,#intro.on #t2{opacity:1;transform:none}
#skip{position:fixed;top:12px;right:12px;background:rgba(0,0,0,.45);color:#fff;border:1px solid #fff5;border-radius:18px;padding:8px 14px;font-size:14px}
#hud{position:fixed;left:0;right:0;bottom:0;pointer-events:none;display:none}
#note{position:fixed;left:8px;right:8px;top:8px;text-align:center;color:#fff9;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
#stick{position:fixed;left:22px;bottom:34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.65)}
#photo{position:fixed;right:22px;bottom:44px;width:70px;height:70px;border-radius:50%;background:#d9a441;border:4px solid #fff;font-size:30px;line-height:62px;text-align:center;box-shadow:0 4px 14px #0008}
#hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#fffb;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
.lb{position:fixed;left:0;top:0;color:#fff;font-size:13px;font-weight:800;background:rgba(0,0,0,.45);padding:4px 9px;border-radius:12px;white-space:nowrap;pointer-events:none;will-change:transform}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
</style></head><body>
<div id="intro"><div id="t1"></div><div id="t2"></div></div>
<div id="note"></div><div id="flash"></div>
<div id="skip"></div>
<div id="stick" style="display:none"><div id="knob"></div></div>
<div id="photo" style="display:none">📷</div>

<script src="three.min.js"></script>
<script>
const Q=new URLSearchParams(location.search);
const AR=Q.get('lang')==='ar', SC=Q.get('s')||'giza';
const TXT={
 giza:{t:AR?'أهرامات الجيزة':'Pyramids of Giza',s:AR?'مشهد ثلاثي الأبعاد مرسوم، اتحرك واتفرج':'A stylized 3D scene. Walk around.'},
 karnak:{t:AR?'معبد الكرنك':'Karnak Temple',s:AR?'قاعة الأعمدة الكبرى (مشهد مرسوم)':'The Great Hypostyle Hall (stylized)'}
}[SC]||{t:Q.get('n')||SC,s:AR?'مشهد ثلاثي الأبعاد مرسوم ومتولّد، اتحرك واتفرج':'A stylized generated 3D scene. Walk around.'};
const L={skip:AR?'تخطّي':'Skip',note:AR?'مشهد ثلاثي الأبعاد مرسوم بالكود، مش تصوير حقيقي. الصور الحقيقية في المعرض.':'A stylized 3D scene drawn in code, not real photography. Real photos are in the gallery.',
 hint:AR?'العصا يسار للمشي • اسحب باقي الشاشة للنظر':'Left stick to walk • drag anywhere else to look'};
document.getElementById('t1').textContent=TXT.t;document.getElementById('t2').textContent=TXT.s;
document.getElementById('skip').textContent=L.skip;document.getElementById('note').textContent=L.note;document.getElementById('hint').textContent=L.hint;

const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,3000);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=4;return t}
function rnd(a){return (Math.sin(a*127.1)*43758.5453)%1}
const stoneTex=(base,rep)=>canvasTex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=0;y<8;y++){const off=(y%2)*16;for(let x=-1;x<8;x++){const v=Math.abs(rnd(x*7+y*13))*30-15;g.fillStyle=`rgba(${v>0?255:60},${v>0?240:40},${v>0?200:20},${Math.abs(v)/90})`;g.fillRect(x*32+off,y*32,32,32);g.strokeStyle='rgba(70,45,20,.35)';g.lineWidth=2;g.strokeRect(x*32+off,y*32,32,32)}}},rep);
const sandTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d9b673';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,235,190':'170,120,60'},${Math.random()*.18})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[90,90]);

// sky dome
var skyMat;(function(){const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Vector3(.16,.45,.82)},mid:{value:new THREE.Vector3(.55,.78,.95)},hor:{value:new THREE.Vector3(1.,.93,.78)}},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 mid;uniform vec3 hor;varying vec3 p;void main(){float h=normalize(p).y;vec3 c=mix(hor,mid,smoothstep(0.,.25,h));c=mix(c,top,smoothstep(.2,.8,h));gl_FragColor=vec4(c,1.);}'});
 skyMat=m;S.add(new THREE.Mesh(new THREE.SphereGeometry(2500,24,16),m))})();
S.fog=new THREE.Fog(0xf3dfb4,260,1500);
S.add(new THREE.HemisphereLight(0xfff4de,0xb8935a,0.55));
const sun=new THREE.DirectionalLight(0xfff0cf,0.75);sun.position.set(-300,380,200);S.add(sun);
const sunSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,2,64,64,64);gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(.25,'rgba(255,230,160,.6)');gr.addColorStop(1,'rgba(255,230,160,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}),fog:false,depthWrite:false,transparent:true}));
sunSpr.scale.set(520,520,1);sunSpr.position.set(-900,1100,600);S.add(sunSpr);
// clouds
const cloudMat=new THREE.SpriteMaterial({map:canvasTex(128,64,(g,w,h)=>{g.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<9;i++){g.beginPath();g.arc(20+i*11,34+Math.sin(i*2)*8,14+((i*7)%9),0,7);g.fill()}}),fog:false,transparent:true,opacity:.85,depthWrite:false});
const clouds=[];for(let i=0;i<14;i++){const c=new THREE.Sprite(cloudMat);c.scale.set(300+i*20,150,1);c.position.set(Math.cos(i*1.7)*1300,380+(i%4)*60,Math.sin(i*1.7)*1300);S.add(c);clouds.push(c)}

// ===================== generic scene generator =====================
const BIOME=Q.get('b')||'green', NAME=Q.get('n')||'', KC=parseInt((Q.get('k')||'d8c9a8'),16);
const BI={green:{g:'#79b25a',sky:[[.18,.47,.85],[.6,.82,.95],[.93,.96,.92]],fog:0xd7e8d2,tree:'oak'},
 desert:{g:'#d9b673',sky:[[.16,.45,.82],[.55,.78,.95],[1,.93,.78]],fog:0xf3dfb4,tree:'palm'},
 snow:{g:'#eef3f8',sky:[[.35,.5,.78],[.72,.82,.94],[.96,.97,1]],fog:0xe6eef6,tree:'pine'},
 tropical:{g:'#4d9b45',sky:[[.1,.5,.9],[.5,.85,.98],[.9,.97,.95]],fog:0xcfeadc,tree:'palm'}};
const MT=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const ADD=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);S.add(o);return o};
const bx=(w,h,d,x,y,z,m)=>ADD(new THREE.BoxGeometry(w,h,d),m,x,y+h/2,z);
const cyl=(rb,rt,h,x,y,z,m,seg)=>ADD(new THREE.CylinderGeometry(rt,rb,h,seg||18),m,x,y+h/2,z);
const sph=(r,x,y,z,m,sq)=>{const o=ADD(new THREE.SphereGeometry(r,18,14),m,x,y,z);if(sq)o.scale.y=sq;return o};
const cone=(r,h,x,y,z,m,seg)=>ADD(new THREE.ConeGeometry(r,h,seg||16),m,x,y+h/2,z);
function beam(a,b,r,m){const d=new THREE.Vector3().subVectors(b,a);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),6),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());S.add(o);return o}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function wallTex(col,rows,cols){const hx='#'+('000000'+col.toString(16)).slice(-6);return canvasTex(128,128,(g,w,h)=>{g.fillStyle=hx;g.fillRect(0,0,w,h);for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){const v=rnd(x*5+y*11+col%97);g.fillStyle='rgba('+(v>0?'255,255,255':'0,0,0')+','+Math.abs(v)*.1+')';g.fillRect(x*w/cols+(y%2)*3,y*h/rows,w/cols,h/rows)}g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,y*h/rows,w,1.5)}},[3,3])}
const WALL=()=>MT(KC,{map:wallTex(KC,8,5)}); // wall colour of the country
function tree(x,z,k){const B=BI[BIOME]||BI.green,t=k||B.tree,gh=groundH(x,z);const tr=MT(0x6b4a2b);
 if(t==='pine'){cyl(.6,.5,5,x,gh,z,tr,6);for(let i=0;i<3;i++)cone(4.2-i*1.1,5,x,gh+3+i*3,z,MT(0x2f6b45),8)}
 else if(t==='palm'){cyl(.8,.5,11,x,gh,z,tr,6);for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.9,8,4),MT(0x2f8a3f));l.position.set(x+Math.cos(i*.9)*3.2,gh+11.2,z-Math.sin(i*.9)*3.2);l.lookAt(x,gh+12,z);l.rotateX(Math.PI/2);S.add(l)}}
 else{cyl(.7,.5,5,x,gh,z,tr,6);sph(4,x,gh+7,z,MT(0x3f8f45));sph(3,x+2,gh+9,z+1,MT(0x4aa04e))}}
function water(y,size,col){const w=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshLambertMaterial({color:col||0x2e8fc4,transparent:true,opacity:.92}));w.rotation.x=-Math.PI/2;w.position.y=y;S.add(w);return w}
function orbit(r0,r1,h0,h1,ly){return u=>{const a=-1.3+u*1.6,r=r0-u*(r0-r1);return [Math.sin(a)*r,h0-u*(h0-h1),Math.cos(a)*r,0,ly,0]}}
function buildGeneric(){
 const B=BI[BIOME]||BI.green;
 skyMat.uniforms.top.value.set(...B.sky[0]);skyMat.uniforms.mid.value.set(...B.sky[1]);skyMat.uniforms.hor.value.set(...B.sky[2]);
 S.fog=new THREE.Fog(B.fog,170,1100);
 const hilly=['greatwall','wall','nature','fuji','christ','pyramid_none'].includes(SC);
 groundH=hilly?((x,z)=>{const r=Math.hypot(x,z);const f=Math.min(1,Math.max(0,(r-90)/160));return f*(Math.sin(x*.02)*Math.cos(z*.017)*26+Math.sin(x*.05+z*.03)*5+24*f)}):(()=>0);
 if(SC==='greatwall'||SC==='wall'){groundH=(x,z)=>{const rid=Math.exp(-Math.pow((x-Math.sin(z*.02)*70)/50,2));return 30*rid+Math.sin(x*.02+z*.015)*8+Math.max(0,Math.abs(x)-180)*.18}}
 const gt=canvasTex(128,128,(g,w,h)=>{g.fillStyle=B.g;g.fillRect(0,0,w,h);for(let i=0;i<1800;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${Math.random()*.12})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[120,120]);
 const gg=new THREE.PlaneGeometry(2400,2400,130,130);gg.rotateX(-Math.PI/2);const pa=gg.attributes.position;for(let i=0;i<pa.count;i++)pa.setY(i,groundH(pa.getX(i),pa.getZ(i)));gg.computeVertexNormals();
 S.add(new THREE.Mesh(gg,new THREE.MeshLambertMaterial({map:gt})));
 LIMIT=170;let dist=90,r0=260,r1=120,h0=120,h1=40,ly=25,lab=60;const W=WALL(),white=MT(0xf1ece0),dark=MT(0x3a3025);
 switch(SC){
 case 'eiffel':case 'tower':case 'burj':{
  const iron=MT(SC==='eiffel'?0x7a6650:0xb9c4cf);
  if(SC==='eiffel'){const c=[[1,1],[1,-1],[-1,1],[-1,-1]];
   c.forEach(p=>{beam(V(p[0]*26,0,p[1]*26),V(p[0]*9,52,p[1]*9),1.6,iron);beam(V(p[0]*9,52,p[1]*9),V(p[0]*3,110,p[1]*3),1.2,iron)});
   [0,52,110].forEach((y,i)=>{const r=[26,9,3][i];bx(r*2+4,2.4,r*2+4,0,y,0,iron)});
   for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4==2?3:(i+1)%4];}
   [[26,0],[-26,0],[0,26],[0,-26]].forEach(p=>{const q=p[0]?[p[0],p[0]]:[p[1],p[1]];beam(V(p[0]?p[0]:-26,3,p[1]?p[1]:-26),V(p[0]?p[0]:26,3,p[1]?p[1]:26),.9,iron)});
   beam(V(-9,52,-9),V(9,52,9),.7,iron);beam(V(-9,52,9),V(9,52,-9),.7,iron);
   cyl(1.4,.3,40,0,112,0,iron,8);sph(2.4,0,150,0,MT(0xffe9a8));lab=165;ly=70;dist=110;r0=300;h0=130;
   for(let i=-3;i<=3;i++){bx(60,.8,6,0,0,60+i*0,MT(0x8a8a82));}
   for(let i=0;i<12;i++){tree(-70,-90+i*16);tree(70,-90+i*16)}
  }else{ // generic tall tower / Burj style
   const H=SC==='burj'?190:120;for(let i=0;i<8;i++){const w=26-i*3,y=i*H/8;bx(w,H/8+.5,w,0,y,0,iron)}cyl(.8,.2,H*.25,0,H,0,iron,6);lab=H+40;ly=H*.4;dist=110;h0=H;r0=300;
   if(SC==='tower'){sph(8,0,H*.72,0,iron)}
   for(let i=0;i<10;i++){tree(-60+i*13,-50);tree(-60+i*13,50)}
  }
  break}
 case 'bigben':{
  bx(20,60,20,0,0,0,W);bx(24,3,24,0,60,0,dark);cone(14,22,0,63,0,MT(0x3f5f6a),4).rotation.y=Math.PI/4;
  [[0,10.1],[0,-10.1],[10.1,0],[-10.1,0]].forEach((p,i)=>{const f=ADD(new THREE.CircleGeometry(6,28),MT(0xfdf6d8),p[0],46,p[1]);f.rotation.y=i<2?(i?Math.PI:0):(i==2?Math.PI/2:-Math.PI/2);
   const h=ADD(new THREE.BoxGeometry(.5,5,.3),MT(0x222),p[0]*1.01,47.5,p[1]*1.01);h.rotation.y=f.rotation.y});
  bx(60,24,16,-40,0,0,W);for(let i=0;i<6;i++)bx(3,16,.6,-60+i*8,4,8.2,dark);
  bx(120,1,8,0,0,60,MT(0x555555));lab=95;ly=30;dist=80;r0=200;h0=90;
  for(let i=0;i<8;i++)tree(-90+i*26,40);break}
 case 'pisa':{
  const m=MT(0xf4f0e6,{map:canvasTex(64,64,(g,w,h)=>{g.fillStyle='#f4f0e6';g.fillRect(0,0,w,h);g.fillStyle='rgba(0,0,0,.35)';for(let i=0;i<8;i++){g.fillRect(i*8+2,10,4,12);g.fillRect(i*8+2,36,4,12)}},[8,1])});
  const t=new THREE.Group();for(let i=0;i<8;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(i==7?7:9,9,7.5,24),m);c.position.y=i*7.7+4;t.add(c)}t.rotation.z=-0.075;t.position.set(0,0,0);S.add(t);
  bx(34,20,70,-45,0,10,MT(0xf4efe4));cone(18,14,-45,20,10,MT(0x9a6a4a),4).rotation.y=Math.PI/4;
  cyl(16,14,18,-45,0,-52,white);sph(14,-45,18,-52,MT(0xb77d5a),.6);
  lab=75;ly=30;dist=85;r0=200;h0=80;for(let i=0;i<6;i++)tree(30+i*12,40,'oak');break}
 case 'dome':case 'taj':case 'hagia':{
  const taj=SC==='taj',tone=taj?0xf6f2ea:KC,m=MT(tone,{map:wallTex(tone,6,4)});
  bx(80,4,80,0,0,0,MT(taj?0xf4efe6:0xcdb99a));bx(36,32,36,0,4,0,m);
  cyl(13,13,8,0,34,0,m);const dm=sph(15,0,40,0,MT(taj?0xfbf8f0:0x9fb3b8),1.15);cyl(1.2,.2,10,0,56,0,MT(0xe3b84a),6);
  if(!taj){[[24,0],[-24,0],[0,24],[0,-24]].forEach(p=>sph(11,p[0],26,p[1],MT(0x9fb3b8),.8))}
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(p=>{cyl(3,2.4,taj?44:52,p[0]*(taj?38:30),taj?4:0,p[1]*(taj?38:30),taj?white:m,16);cone(3.4,7,p[0]*(taj?38:30),taj?48:52,p[1]*(taj?38:30),MT(taj?0xf8f5ee:0x9fb3b8),16);
   if(taj){sph(4,p[0]*17,36,p[1]*17,white,1)}});
  if(taj){bx(10,2,120,0,0,80,MT(0x2f93c8)).position.y=.3;for(let i=-4;i<=4;i++){if(i){cyl(1.4,1,9,i*4,0,80,MT(0x2f6b45),8)}}}
  lab=75;ly=30;dist=110;r0=260;h0=100;break}
 case 'arena':case 'colosseum':{
  const m=MT(KC,{map:wallTex(KC,10,6)}),N=72;
  for(let t=0;t<3;t++){for(let i=0;i<N;i++){if(t==2&&rnd(i)>.55&&i>20&&i<44)continue;const a=i/N*Math.PI*2,rx=62-t*.6,rz=48-t*.5,x=Math.cos(a)*rx,z=Math.sin(a)*rz;
    const sg=bx(Math.PI*2*Math.max(rx,rz)/N*1.05,12,3.6,x,t*12,z,m);sg.rotation.y=-a-Math.PI/2;sg.rotation.y=Math.atan2(-Math.cos(a)*rz,Math.sin(a)*rx)+0;sg.rotation.y=-Math.atan2(z/(rz*rz),x/(rx*rx))+Math.PI/2*0;
    const ar=bx(Math.PI*2*Math.max(rx,rz)/N*.5,8,4,x*1.002,t*12+1.5,z*1.002,dark);ar.rotation.y=sg.rotation.y}}
  const fl=ADD(new THREE.CircleGeometry(1,40),MT(0xc9a56a),0,.2,0);fl.rotation.x=-Math.PI/2;fl.scale.set(54,44,1);
  lab=55;ly=15;dist=100;r0=240;h0=90;for(let i=0;i<8;i++)tree(-80+i*24,90,'oak');break}
 case 'statue':case 'liberty':case 'christ':{
  const lib=SC==='liberty',chr=SC==='christ',m=MT(lib?0x6fb7a2:0xe9e6df);
  if(lib||SC==='statue'){water(-.4,2400);bx(50,3,50,0,0,0,MT(0x8a8f82));groundH=()=>0}
  if(chr){cone(60,52,0,0,0,MT(0x6c7f5b),10);groundH=(x,z)=>0;}
  const by=chr?52:3;bx(18,16,18,0,by,0,MT(0xcfc9ba));bx(14,6,14,0,by+16,0,MT(0xbdb7a6));const y0=by+22;
  if(lib){cone(7,34,0,y0,0,m,14);cyl(3,2.4,10,0,y0+34,0,m);sph(2.8,0,y0+46,0,m);for(let i=0;i<7;i++){const r=cone(.7,6,Math.cos(i*.9)*3.5,y0+48,Math.sin(i*.9)*3.5,m,6);r.rotation.z=Math.cos(i*.9)*.6;r.rotation.x=Math.sin(i*.9)*.6}
   const arm=cyl(1.4,1,22,5,y0+36,0,m,8);arm.rotation.z=-.25;sph(2.4,10,y0+60,0,MT(0xffd86b));cone(2,5,10,y0+61,0,MT(0xffb347),8)}
  else{cyl(4,2.8,34,0,y0,0,m,10);bx(46,4,5,0,y0+26,0,m);sph(3.2,0,y0+38,0,m);[-1,1].forEach(s=>cyl(2,1.6,10,s*20,y0+16,0,m,8))}
  lab=y0+60;ly=y0+15;dist=100;r0=250;h0=100;if(chr){LIMIT=120;dist=130}
  for(let i=0;i<10;i++){tree(-100+i*22,chr?-40:-60+Math.random()*10)}break}

addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===stickId)stickMove(t);else if(t.identifier===lookId){P.yaw-=(t.clientX-lx)*0.005;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(t.clientY-ly)*0.004));lx=t.clientX;ly=t.clientY}}e.preventDefault()},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===stickId){stickId=null;mv.x=mv.y=0;knob.style.left='35px';knob.style.top='35px'}if(t.identifier===lookId)lookId=null}});
addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.identifier===stickId)continue;if(e.target.id==='photo'||e.target.id==='skip'||e.target.closest('#stick'))continue;lookId=t.identifier;lx=t.clientX;ly=t.clientY}},{passive:false});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let md=false;addEventListener('mousedown',e=>{md=true;lx=e.clientX;ly=e.clientY});addEventListener('mouseup',()=>md=false);addEventListener('mousemove',e=>{if(md&&mode==='walk'){P.yaw-=(e.clientX-lx)*0.005;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY}});

function photo(){const f=document.getElementById('flash');f.style.transition='none';f.style.opacity=.9;setTimeout(()=>{f.style.transition='opacity .4s';f.style.opacity=0},40);
 R.render(S,cam);const url=R.domElement.toDataURL('image/jpeg',0.92);
 if(window.NiloPhoto&&NiloPhoto.postMessage)NiloPhoto.postMessage(url);else{const a=document.createElement('a');a.href=url;a.download='nilo.jpg';a.click()}}
document.getElementById('photo').addEventListener('click',photo);
window.nilo_snap=photo;

let last=performance.now();const tmp=new THREE.Vector3();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
 clouds.forEach((c,i)=>{c.position.x+=dt*(2+i%3)*(i%2?1:-1);if(Math.abs(c.position.x)>1500)c.position.x*=-.98});
 camelsTick(t);
 if(mode==='intro'){const u=Math.min(1,t/9);const e=u*u*(3-2*u);const p=introPath(e);cam.position.set(p[0],p[1]+groundH(p[0],p[2]),p[2]);cam.lookAt(p[3],p[4],p[5]);if(t>9.5)endIntro();}
 else{
  let fx=-mv.y,sx=mv.x;if(keys.w||keys.arrowup)fx=1;if(keys.s||keys.arrowdown)fx=-1;if(keys.a||keys.arrowleft)sx=-1;if(keys.d||keys.arrowright)sx=1;
  const sp=(keys.shift?60:28);const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
  P.x+=(-sin*fx+cos*sx)*sp*dt;P.z+=(-cos*fx-sin*sx)*sp*dt;
  const r=Math.hypot(P.x,P.z);if(r>LIMIT+(SC==='giza'?100:0)){const k=(LIMIT+(SC==='giza'?100:0))/r;P.x*=k;P.z*=k}
  const bob=(Math.abs(fx)+Math.abs(sx))>0.1?Math.sin(t*9)*0.12:0;
  cam.position.set(P.x,groundH(P.x,P.z)+1.75+bob,P.z);cam.rotation.order='YXZ';cam.rotation.set(P.pitch,P.yaw,0);
 }
 R.render(S,cam);
 labels.forEach(l=>{tmp.copy(l.p).project(cam);const d=cam.position.distanceTo(l.p);const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&mode==='walk'&&d<700;l.d.style.opacity=vis?1:0;l.d.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`});
}
requestAnimationFrame(loop);
</script></body></html>
